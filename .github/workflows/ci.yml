name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

# Required permissions for reusable workflow (even when release is disabled)
permissions:
  contents: write
  id-token: write

jobs:
  ci:
    name: "CI Pipeline"
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-ci.yml@v2.4.1
    with:
      pixi-environment: 'dev'
      python-versions: '["3.11", "3.12"]'
      os-matrix: '["ubuntu-latest"]'
      enable-performance: false
      enable-release: false
      enable-hygiene-check: true
    secrets: inherit

  ci-success:
    name: "CI Success"
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
